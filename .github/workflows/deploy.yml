name: Deploy to VPS

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'mcp-server/**'
      - 'infra/**'
      - 'mcp-registry-badge/**'

  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      NODE_VERSION: "22"
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}      # deploy
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}      # /var/www/astro-glushkov
      WP_GRAPHQL_URL: ${{ secrets.WP_GRAPHQL_URL }}
      CMS_GALLERY_URL: ${{ secrets.CMS_GALLERY_URL }}
      PUBLIC_WP_REST_URL: ${{ secrets.PUBLIC_WP_REST_URL }}
      WP_GRAPHQL_SECRET: ${{ secrets.WP_GRAPHQL_SECRET }}  # ← добавлено

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build project
        env:
          WP_GRAPHQL_URL: ${{ env.WP_GRAPHQL_URL }}
          CMS_GALLERY_URL: ${{ env.CMS_GALLERY_URL }}
          PUBLIC_WP_REST_URL: ${{ env.PUBLIC_WP_REST_URL }}
          WP_GRAPHQL_SECRET: ${{ env.WP_GRAPHQL_SECRET }}  # ← добавлено
        run: npm run build

      - name: Prepare SSH
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/github_actions_deploy
          chmod 600 ~/.ssh/github_actions_deploy

          test -s ~/.ssh/github_actions_deploy
          test -n "${DEPLOY_HOST}"
          test -n "${DEPLOY_PORT}"
          test -n "${DEPLOY_USER}"
          test -n "${DEPLOY_PATH}"

          ssh-keyscan -p "${DEPLOY_PORT}" -H "${DEPLOY_HOST}" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Test SSH connection
        run: |
          ssh -p "${DEPLOY_PORT}" \
            -i ~/.ssh/github_actions_deploy \
            -o StrictHostKeyChecking=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "echo connected"

      - name: Deploy dist via rsync
        run: |
          rsync -az --delete \
            -e "ssh -p ${DEPLOY_PORT} -i ~/.ssh/github_actions_deploy -o StrictHostKeyChecking=yes" \
            dist/ \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/dist/"

      - name: Deploy package.json and package-lock.json
        run: |
          rsync -az \
            -e "ssh -p ${DEPLOY_PORT} -i ~/.ssh/github_actions_deploy -o StrictHostKeyChecking=yes" \
            package.json package-lock.json \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/"

      - name: Update .env on VPS
        shell: bash
        run: |
          set -euo pipefail

          # A value with a newline would inject extra lines into the .env file.
          check_value() {
            if [[ "$2" == *$'\n'* ]]; then
              echo "::error::$1 contains a newline"
              exit 1
            fi
          }

          check_value WP_GRAPHQL_URL "$WP_GRAPHQL_URL"
          check_value CMS_GALLERY_URL "$CMS_GALLERY_URL"
          check_value PUBLIC_WP_REST_URL "$PUBLIC_WP_REST_URL"
          check_value WP_GRAPHQL_SECRET "$WP_GRAPHQL_SECRET"

          # Single pass: the heredoc is expanded on the runner only, and the
          # remote side just writes stdin, so `$` in a secret survives intact.
          ssh -p "${DEPLOY_PORT}" \
            -i ~/.ssh/github_actions_deploy \
            -o StrictHostKeyChecking=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "umask 077 && cat > '${DEPLOY_PATH}/.env'" <<EOF
          WP_GRAPHQL_URL=${WP_GRAPHQL_URL}
          CMS_GALLERY_URL=${CMS_GALLERY_URL}
          PUBLIC_WP_REST_URL=${PUBLIC_WP_REST_URL}
          WP_GRAPHQL_SECRET=${WP_GRAPHQL_SECRET}
          HOST=0.0.0.0
          PORT=4321
          DEPLOYPATH=${DEPLOY_PATH}
          EOF

      - name: Install production dependencies on VPS
        run: |
          ssh -p "${DEPLOY_PORT}" \
            -i ~/.ssh/github_actions_deploy \
            -o StrictHostKeyChecking=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "cd '${DEPLOY_PATH}' && npm ci --omit=dev"

      - name: Restart Astro with PM2
        run: |
          ssh -p "${DEPLOY_PORT}" \
            -i ~/.ssh/github_actions_deploy \
            -o StrictHostKeyChecking=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "cd '${DEPLOY_PATH}' && pm2 restart astro-site || pm2 start dist/server/entry.mjs --name astro-site --node-args='--env-file=.env'"

      - name: Save PM2 process list
        run: |
          ssh -p "${DEPLOY_PORT}" \
            -i ~/.ssh/github_actions_deploy \
            -o StrictHostKeyChecking=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "pm2 save"

      # Очистка кэша Cloudflare после деплоя. Используется отдельный
      # CLOUDFLARE_CACHE_TOKEN, если он задан; иначе CLOUDFLARE_API_TOKEN.
      # Токену нужны Zone:Read и Zone:Cache Purge. Ошибка purge не валит
      # деплой: сайт уже обновлён, а предупреждение видно в Actions.
      - name: Purge Cloudflare cache
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_CACHE_TOKEN: ${{ secrets.CLOUDFLARE_CACHE_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          set -uo pipefail

          token="${CLOUDFLARE_CACHE_TOKEN:-${CLOUDFLARE_API_TOKEN}}"
          if [ -z "${token}" ]; then
            echo "::warning::Cloudflare cache purge skipped: no token configured."
            echo "### Cloudflare cache: skipped (no token)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          zone_id="${CLOUDFLARE_ZONE_ID}"
          if [ -z "${zone_id}" ]; then
            if ! zones_json=$(curl --fail --silent --show-error \
              -H "Authorization: Bearer ${token}" \
              "https://api.cloudflare.com/client/v4/zones?name=glushkov-modelling.com"); then
              echo "::warning::Cloudflare zone lookup failed; check Zone:Read on the token."
              echo "### Cloudflare cache: skipped (zone lookup failed)" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if ! zone_id=$(node -e "const d=JSON.parse(process.argv[1]);if(!d.success||!d.result||d.result.length===0){console.error(JSON.stringify(d.errors||[]));process.exit(1)}process.stdout.write(d.result[0].id)" "$zones_json"); then
              echo "::warning::Cloudflare zone glushkov-modelling.com not found."
              echo "### Cloudflare cache: skipped (zone not found)" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi

          if ! purge_json=$(curl --fail --silent --show-error \
            -X POST "https://api.cloudflare.com/client/v4/zones/${zone_id}/purge_cache" \
            -H "Authorization: Bearer ${token}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'); then
            echo "::warning::Cloudflare cache purge failed; check Zone:Cache Purge on the token."
            echo "### Cloudflare cache: purge failed (permission?)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if ! node -e "const d=JSON.parse(process.argv[1]);if(!d.success){console.error(JSON.stringify(d.errors||[]));process.exit(1)}console.log('cloudflare cache purged')" "$purge_json"; then
            echo "::warning::Cloudflare cache purge returned success=false."
            echo "### Cloudflare cache: purge failed" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "### Cloudflare cache: purged" >> "$GITHUB_STEP_SUMMARY"
