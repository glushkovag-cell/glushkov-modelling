name: Deploy MCP registry badge worker

# Запускается вручную. Custom Domain mcp-badge.glushkov-modelling.com
# создаётся при первом деплое вместе с DNS-записью и сертификатом.
on:
  workflow_dispatch:

concurrency:
  group: badge-worker-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  BADGE_BASE: https://mcp-badge.glushkov-modelling.com

jobs:
  deploy:
    name: Deploy to Cloudflare
    runs-on: ubuntu-latest
    environment: production

    defaults:
      run:
        working-directory: mcp-registry-badge

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mcp-registry-badge/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npx vitest run

      - name: Deploy worker
        run: npx wrangler deploy

      # DNS-запись Custom Domain появляется у резолверов раннера не сразу.
      - name: Wait for DNS and TLS
        run: |
          set -eu
          for attempt in $(seq 1 24); do
            if curl --silent --fail --max-time 5 --output /dev/null "${BADGE_BASE}/"; then
              echo "Badge reachable after ${attempt} attempt(s)"
              exit 0
            fi
            echo "attempt ${attempt}: not reachable yet"
            sleep 10
          done
          echo "::error::Badge host did not become reachable within 4 minutes"
          exit 1

      - name: Smoke test health
        run: |
          curl --fail --silent --show-error "${BADGE_BASE}/" -o health.json
          node -e "const d=require('./health.json');if(!d.ok||d.badgeSvgEndpoint!==process.env.BADGE_BASE+'/badge.svg')process.exit(1);console.log('health',d.serverName,d.cacheTtlSeconds)"

      - name: Smoke test badge JSON
        run: |
          curl --fail --silent --show-error "${BADGE_BASE}/badge" -o badge.json
          node -e "const d=require('./badge.json');if(d.schemaVersion!==1||!/^v\d/.test(d.message))process.exit(1);console.log('badge',d.message,d.cacheSeconds)"

      - name: Smoke test badge SVG
        run: |
          curl --fail --silent --show-error -D headers.txt "${BADGE_BASE}/badge.svg" -o badge.svg
          grep -qi '^content-type: image/svg+xml' headers.txt
          grep -q '<svg' badge.svg
          grep -i '^cache-control:' headers.txt

      - name: Smoke test CORS preflight
        run: |
          code=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            -X OPTIONS "${BADGE_BASE}/badge" \
            -H 'Origin: https://www.glushkov-modelling.com' \
            -H 'Access-Control-Request-Method: GET')
          test "${code}" = "204"
          echo "preflight ${code}"
