name: Deploy MCP Server to VPS

on:
  push:
    branches:
      - main
    paths:
      - 'mcp-server/**'
      - '.github/workflows/mcp-deploy.yml'
  workflow_dispatch:

concurrency:
  group: mcp-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-server

    env:
      NODE_VERSION: "22"
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      MCP_DEPLOY_PATH: /var/www/mcp-glushkov

      MCP_API_KEY: ${{ secrets.MCP_API_KEY }}
      WP_GRAPHQL_URL: ${{ secrets.WP_GRAPHQL_URL }}
      WP_GRAPHQL_SECRET: ${{ secrets.WP_GRAPHQL_SECRET }}
      WP_READONLY_USERNAME: ${{ secrets.WP_READONLY_USERNAME }}
      WP_READONLY_APP_PASSWORD: ${{ secrets.WP_READONLY_APP_PASSWORD }}
      CMS_GALLERY_URL: ${{ secrets.CMS_GALLERY_URL }}

      OAUTH_ISSUER: ${{ secrets.OAUTH_ISSUER }}
      OAUTH_JWKS_URI: ${{ secrets.OAUTH_JWKS_URI }}
      OAUTH_AUDIENCE: ${{ secrets.OAUTH_AUDIENCE }}
      OAUTH_REQUIRED_SCOPE: content:read
      OAUTH_RESOURCE_METADATA_URI: https://mcp.glushkov-modelling.com/.well-known/oauth-protected-resource/mcp-oauth

      GALLERY_MANIFEST_PATH: /var/www/cms/gallery
      MCP_ALLOWED_ORIGINS: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Prepare SSH
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/github_actions_deploy
          chmod 600 ~/.ssh/github_actions_deploy

          test -s ~/.ssh/github_actions_deploy
          test -n "${DEPLOY_HOST}"
          test -n "${DEPLOY_PORT}"
          test -n "${DEPLOY_USER}"
          test -n "${OAUTH_ISSUER}"
          test -n "${OAUTH_JWKS_URI}"
          test -n "${OAUTH_AUDIENCE}"

          ssh-keyscan -p "${DEPLOY_PORT}" -H "${DEPLOY_HOST}" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Test SSH connection
        run: |
          ssh -p "${DEPLOY_PORT}" \
            -i ~/.ssh/github_actions_deploy \
            -o StrictHostKeyChecking=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "echo connected"

      - name: Deploy build via rsync
        run: |
          rsync -az --delete \
            -e "ssh -p ${DEPLOY_PORT} -i ~/.ssh/github_actions_deploy -o StrictHostKeyChecking=yes" \
            build/ \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${MCP_DEPLOY_PATH}/build/"

      - name: Deploy package files
        run: |
          rsync -az \
            -e "ssh -p ${DEPLOY_PORT} -i ~/.ssh/github_actions_deploy -o StrictHostKeyChecking=yes" \
            package.json package-lock.json \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${MCP_DEPLOY_PATH}/"

      - name: Update .env on VPS
        shell: bash
        run: |
          ssh -p "${DEPLOY_PORT}" \
            -i ~/.ssh/github_actions_deploy \
            -o StrictHostKeyChecking=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "mkdir -p '${MCP_DEPLOY_PATH}' && chmod 700 '${MCP_DEPLOY_PATH}'"

          cat <<EOF | ssh -p "${DEPLOY_PORT}" \
            -i ~/.ssh/github_actions_deploy \
            -o StrictHostKeyChecking=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "umask 077 && cat > '${MCP_DEPLOY_PATH}/.env'"
          MCP_API_KEY=${MCP_API_KEY}
          WP_GRAPHQL_URL=${WP_GRAPHQL_URL}
          WP_GRAPHQL_SECRET=${WP_GRAPHQL_SECRET}
          WP_READONLY_USERNAME=${WP_READONLY_USERNAME}
          WP_READONLY_APP_PASSWORD=${WP_READONLY_APP_PASSWORD}
          GALLERY_MANIFEST_PATH=${GALLERY_MANIFEST_PATH}
          CMS_GALLERY_URL=${CMS_GALLERY_URL}
          HOST=127.0.0.1
          PORT=4322
          MCP_ALLOWED_ORIGINS=${MCP_ALLOWED_ORIGINS}
          OAUTH_ISSUER=${OAUTH_ISSUER}
          OAUTH_JWKS_URI=${OAUTH_JWKS_URI}
          OAUTH_AUDIENCE=${OAUTH_AUDIENCE}
          OAUTH_REQUIRED_SCOPE=${OAUTH_REQUIRED_SCOPE}
          OAUTH_RESOURCE_METADATA_URI=${OAUTH_RESOURCE_METADATA_URI}
          EOF

      - name: Install production dependencies on VPS
        run: |
          ssh -p "${DEPLOY_PORT}" \
            -i ~/.ssh/github_actions_deploy \
            -o StrictHostKeyChecking=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "cd '${MCP_DEPLOY_PATH}' && npm ci --omit=dev"

      - name: Restart MCP server with PM2
        run: |
          ssh -p "${DEPLOY_PORT}" \
            -i ~/.ssh/github_actions_deploy \
            -o StrictHostKeyChecking=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "cd '${MCP_DEPLOY_PATH}' && pm2 restart mcp-server --update-env || pm2 start build/index.js --name mcp-server --node-args='--env-file=.env'"

      - name: Verify MCP health check
        run: |
          ssh -p "${DEPLOY_PORT}" \
            -i ~/.ssh/github_actions_deploy \
            -o StrictHostKeyChecking=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "curl --fail --silent --show-error http://127.0.0.1:4322/health"

      - name: Save PM2 process list
        if: success()
        run: |
          ssh -p "${DEPLOY_PORT}" \
            -i ~/.ssh/github_actions_deploy \
            -o StrictHostKeyChecking=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "pm2 save"
