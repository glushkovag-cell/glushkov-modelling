name: Deploy rigging calculator worker

# Деплой при push в main, если изменился Worker, общее ядро толщин такелажа
# или сам workflow. Ручной запуск остаётся для повторного деплоя.
on:
  push:
    branches: [main]
    paths:
      - 'rigging-calculator-worker/**'
      - 'src/lib/rigging/**'
      - '.github/workflows/rigging-worker-deploy.yml'
  workflow_dispatch:

concurrency:
  group: rigging-worker-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Cloudflare
    runs-on: ubuntu-latest
    environment: production

    defaults:
      run:
        working-directory: rigging-calculator-worker

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: rigging-calculator-worker/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Deploy worker
        run: npx wrangler deploy

      # Custom Domain и DNS-запись создаются в момент первого деплоя, а
      # резолверы GitHub-раннера видят их не сразу. Без ожидания smoke падает
      # на "Could not resolve host" при живом и уже задеплоенном Worker.
      - name: Wait for DNS and TLS
        run: |
          set -eu
          for attempt in $(seq 1 24); do
            if curl --silent --fail --max-time 5 --output /dev/null \
              https://rigging-api.glushkov-modelling.com/api/rigging/v1/health; then
              echo "API reachable after ${attempt} attempt(s)"
              exit 0
            fi
            echo "attempt ${attempt}: not reachable yet"
            sleep 10
          done
          echo "::error::API did not become reachable within 4 minutes"
          exit 1

      - name: Smoke test health
        run: |
          curl --fail --silent --show-error \
            https://rigging-api.glushkov-modelling.com/api/rigging/v1/health -o health.json
          node -e "const d=require('./health.json');if(!d.ok)process.exit(1);if(d.algorithmVersion!=='1.0.0')process.exit(1);console.log('health',d.apiVersion,d.algorithmVersion)"

      - name: Smoke test profiles
        run: |
          curl --fail --silent --show-error \
            https://rigging-api.glushkov-modelling.com/api/rigging/v1/profiles -o profiles.json
          node -e "const d=require('./profiles.json');const ids=(d.profiles||[]).map(p=>p.profileId);if(ids.length!==4)process.exit(1);for(const id of ['traditional_plant','yacht_metal_yacht','yacht_metal_schooner','early_plant'])if(!ids.includes(id))process.exit(1);const e=d.profiles.find(p=>p.profileId==='early_plant');if(e.latest!=='1.2.1')process.exit(1);console.log('profiles',ids.join(','))"

      - name: Smoke test pinned profile version
        run: |
          curl --fail --silent --show-error \
            https://www.glushkov-modelling.com/api/rigging/profiles/early_plant/1.2.1 -o early.json
          node -e "const d=require('./early.json');if(d.profile.profileVersion!=='1.2.1')process.exit(1);if(d.rules.length!==48)process.exit(1);console.log('early_plant rules',d.rules.length)"

      - name: Smoke test calculate
        run: |
          cat > input.json <<'JSON'
          {
            "profileId": "traditional_plant",
            "profileVersion": null,
            "scaleDenominator": 64,
            "measurements": {
              "mastDiameter": {
                "main": {
                  "value": 10,
                  "unitId": "mm",
                  "basis": "model",
                  "measurementPointId": "partner"
                }
              },
              "bowspritDiameter": null,
              "hullWidth": null,
              "gunBore": null
            },
            "nodes": [
              {
                "nodeId": "mast.main.lower",
                "nodeType": "lower_mast",
                "parentNodeId": null,
                "ownerType": "mast",
                "ownerId": "main",
                "present": true
              }
            ]
          }
          JSON
          curl --fail --silent --show-error \
            -X POST https://rigging-api.glushkov-modelling.com/api/rigging/v1/calculate \
            -H 'content-type: application/json' \
            --data @input.json -o calculate.json
          node -e "const d=require('./calculate.json');if(d.profileId!=='traditional_plant')process.exit(1);const s=d.results&&d.results.find(x=>x.ruleId==='st.lower.stay');if(!s)process.exit(1);if(Math.abs(s.diameterModelMm-1.2)>1e-9)process.exit(1);if(s.material!=='fiber')process.exit(1);if(!Array.isArray(s.sourceIds)||s.sourceIds.length===0)process.exit(1);console.log('stay',s.diameterModelMm,'rows',d.results.length)"

      - name: Smoke test early_plant through the same core
        run: |
          cat > early-input.json <<'JSON'
          {
            "profileId": "early_plant",
            "profileVersion": "1.2.1",
            "scaleDenominator": 65,
            "measurements": {
              "mastDiameter": {
                "main": {
                  "value": 8,
                  "unitId": "mm",
                  "basis": "model",
                  "measurementPointId": "unknown"
                }
              }
            },
            "nodes": [
              {
                "nodeId": "mast.main.lower",
                "nodeType": "lower_mast",
                "parentNodeId": null,
                "ownerType": "mast",
                "ownerId": "main",
                "present": true
              }
            ]
          }
          JSON
          curl --fail --silent --show-error \
            -X POST https://rigging-api.glushkov-modelling.com/api/rigging/v1/calculate \
            -H 'content-type: application/json' \
            --data @early-input.json -o early-calculate.json
          node -e "const d=require('./early-calculate.json');if(d.profileVersion!=='1.2.1')process.exit(1);const s=d.results.find(x=>x.ruleId==='ep.st.lower.shroud');if(!s)process.exit(1);if(Math.abs(s.diameterModelMm-3/28*8)>1e-12)process.exit(1);if(s.coefficientBasis!=='preliminary_fit')process.exit(1);console.log('early shroud',s.diameterModelMm)"

      - name: Smoke test unknown profile is rejected
        run: |
          code=$(curl --silent --output unknown.json --write-out '%{http_code}' \
            -X POST https://rigging-api.glushkov-modelling.com/api/rigging/v1/calculate \
            -H 'content-type: application/json' \
            --data '{"profileId":"unknown_profile","scaleDenominator":64,"measurements":{},"nodes":[]}')
          test "${code}" = "422"
          node -e "const d=require('./unknown.json');if(d.error.code!=='PROFILE_NOT_FOUND')process.exit(1);console.log('unknown profile rejected',d.error.code)"

      - name: Smoke test CORS preflight
        run: |
          code=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            -X OPTIONS https://rigging-api.glushkov-modelling.com/api/rigging/v1/calculate \
            -H 'Origin: https://www.glushkov-modelling.com' \
            -H 'Access-Control-Request-Method: POST')
          test "${code}" = "204"
          echo "preflight ${code}"
