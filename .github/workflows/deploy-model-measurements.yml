name: WordPress — Deploy Model Measurements

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Режим запуска"
        required: true
        default: check
        type: choice
        options:
          - check
          - deploy-inactive

      confirmation:
        description: "Для deploy-inactive введите DEPLOY"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-model-measurements
  cancel-in-progress: false

env:
  PLUGIN_SLUG: gm-model-measurements
  PLUGIN_SOURCE: wordpress/plugins/gm-model-measurements

jobs:
  check:
    name: Check and package
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout selected revision
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Validate requested mode
        env:
          REQUESTED_MODE: ${{ inputs.mode }}
          CONFIRMATION: ${{ inputs.confirmation }}
          SELECTED_REF: ${{ github.ref }}
        shell: bash
        run: |
          set -euo pipefail

          case "$REQUESTED_MODE" in
            check)
              ;;
            deploy-inactive)
              if [[ "$CONFIRMATION" != "DEPLOY" ]]; then
                echo "::error::Для развёртывания введите DEPLOY."
                exit 1
              fi

              if [[ "$SELECTED_REF" != "refs/heads/main" ]]; then
                echo "::error::Развёртывание разрешено только из main."
                exit 1
              fi
              ;;
            *)
              echo "::error::Неизвестный режим запуска."
              exit 1
              ;;
          esac

      - name: Validate plugin structure
        shell: bash
        run: |
          set -euo pipefail

          required=(
            gm-model-measurements.php
            includes/dictionaries.php
            includes/measurements.php
            includes/validation.php
            includes/admin.php
            includes/persistence.php
            includes/dictionary-guards.php
            includes/publication-guards.php
            assets/admin.js
            assets/admin.css
          )

          if [[ ! -d "$PLUGIN_SOURCE" || -L "$PLUGIN_SOURCE" ]]; then
            echo "::error::Каталог плагина отсутствует или является ссылкой."
            exit 1
          fi

          if [[ -n "$(find "$PLUGIN_SOURCE" -type l -print -quit)" ]]; then
            echo "::error::Символические ссылки в каталоге плагина запрещены."
            exit 1
          fi

          if [[ -n "$(
            find "$PLUGIN_SOURCE" \
              \( ! -type d -a ! -type f \) \
              -print -quit
          )" ]]; then
            echo "::error::Каталог плагина содержит неподдерживаемые типы файлов."
            exit 1
          fi

          for file in "${required[@]}"; do
            if [[ ! -f "$PLUGIN_SOURCE/$file" ]]; then
              echo "::error::Отсутствует обязательный файл: $file"
              exit 1
            fi
          done

      - name: Check PHP syntax
        shell: bash
        run: |
          set -euo pipefail

          command -v php >/dev/null
          php --version

          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(
            find "$PLUGIN_SOURCE" -type f -name '*.php' -print0
          )

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail

          node --check "$PLUGIN_SOURCE/assets/admin.js"

      - name: Package plugin
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist

          tar \
            -C "$PLUGIN_SOURCE" \
            -czf "dist/$PLUGIN_SLUG.tar.gz" \
            gm-model-measurements.php \
            includes/dictionaries.php \
            includes/measurements.php \
            includes/validation.php \
            includes/admin.php \
            includes/persistence.php \
            includes/dictionary-guards.php \
            includes/publication-guards.php \
            assets/admin.js \
            assets/admin.css

          (
            cd dist
            sha256sum "$PLUGIN_SLUG.tar.gz" > SHA256SUMS
          )

          tar -tzf "dist/$PLUGIN_SLUG.tar.gz"

      - name: Upload checked artifact
        uses: actions/upload-artifact@v4
        with:
          name: model-measurements-${{ github.sha }}
          path: |
            dist/gm-model-measurements.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

      - name: Write check summary
        shell: bash
        run: |
          {
            echo "## Model Measurements — checks"
            echo
            echo "- Revision: \`$GITHUB_SHA\`"
            echo "- PHP syntax on runner: passed"
            echo "- JavaScript syntax: passed"
            echo "- Required plugin files: present"
            echo "- Deployment archive: created"
            echo "- Functional tests: not performed"
            echo "- WordPress activation: not performed"
            echo "- Server configuration: not checked in check mode"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy inactive plugin
    if: inputs.mode == 'deploy-inactive'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    environment: wordpress-production

    env:
      SSH_HOST: ${{ secrets.DEPLOY_HOST }}
      SSH_PORT: ${{ secrets.DEPLOY_PORT }}
      SSH_USER: ${{ secrets.DEPLOY_USER }}

      WP_ROOT: /var/www/cms/wordpress
      WP_CLI: ${{ vars.WP_CLI || '/usr/local/bin/wp' }}

    steps:
      - name: Download checked artifact
        uses: actions/download-artifact@v4
        with:
          name: model-measurements-${{ github.sha }}
          path: dist

      - name: Verify artifact checksum
        working-directory: dist
        shell: bash
        run: |
          set -euo pipefail

          sha256sum --check SHA256SUMS

      - name: Validate deployment settings
        shell: bash
        run: |
          set -euo pipefail

          [[ "$SSH_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.-]*$ ]] || {
            echo "::error::DEPLOY_HOST отсутствует или имеет неподдерживаемый формат."
            exit 1
          }

          [[ "$SSH_USER" == "deploy" ]] || {
            echo "::error::Этот workflow рассчитан на пользователя deploy."
            exit 1
          }

          [[ "$SSH_PORT" =~ ^[1-9][0-9]{0,4}$ ]] || {
            echo "::error::DEPLOY_PORT должен содержать корректный номер порта."
            exit 1
          }

          (( SSH_PORT <= 65535 )) || {
            echo "::error::DEPLOY_PORT выходит за допустимый диапазон."
            exit 1
          }

          for path in "$WP_ROOT" "$WP_CLI"; do
            [[ "$path" =~ ^/[A-Za-z0-9_./-]+$ ]] || {
              echo "::error::Недопустимый формат удалённого пути."
              exit 1
            }

            [[ "$path" != "/" ]]
            [[ "$path" != *"/../"* ]]
            [[ "$path" != */.. ]]
          done

      - name: Prepare SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077

          if [[ -z "$SSH_PRIVATE_KEY" ]]; then
            echo "::error::DEPLOY_SSH_KEY отсутствует или пуст."
            exit 1
          fi

          install -d -m 700 "$HOME/.ssh"

          printf '%s\n' "$SSH_PRIVATE_KEY" \
            > "$HOME/.ssh/gm_measurements_key"

          chmod 600 "$HOME/.ssh/gm_measurements_key"
          test -s "$HOME/.ssh/gm_measurements_key"

          if ! ssh-keyscan \
            -T 10 \
            -p "$SSH_PORT" \
            -H "$SSH_HOST" \
            > "$HOME/.ssh/gm_measurements_known_hosts"; then
            echo "::error::Не удалось получить SSH host keys сервера через ssh-keyscan."
            exit 1
          fi

          if [[ ! -s "$HOME/.ssh/gm_measurements_known_hosts" ]]; then
            echo "::error::ssh-keyscan не вернул SSH host keys сервера."
            exit 1
          fi

          chmod 644 "$HOME/.ssh/gm_measurements_known_hosts"

          lookup_host="$SSH_HOST"

          if [[ "$SSH_PORT" != "22" ]]; then
            lookup_host="[$SSH_HOST]:$SSH_PORT"
          fi

          if ! ssh-keygen \
            -F "$lookup_host" \
            -f "$HOME/.ssh/gm_measurements_known_hosts" \
            >/dev/null; then
            echo "::error::Полученные host keys не содержат запись для заданных host и port."
            exit 1
          fi

          cat > "$HOME/.ssh/gm_measurements_config" <<EOF
          Host gm-wordpress-measurements
            HostName $SSH_HOST
            Port $SSH_PORT
            User $SSH_USER
            IdentityFile $HOME/.ssh/gm_measurements_key
            UserKnownHostsFile $HOME/.ssh/gm_measurements_known_hosts
            GlobalKnownHostsFile /dev/null
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            ConnectTimeout 15
            ServerAliveInterval 15
            ServerAliveCountMax 3
          EOF

          chmod 600 "$HOME/.ssh/gm_measurements_config"

      - name: Test SSH connection
        shell: bash
        run: |
          set -euo pipefail

          ssh \
            -F "$HOME/.ssh/gm_measurements_config" \
            gm-wordpress-measurements \
            'echo connected'

      - name: Create private upload directory
        shell: bash
        run: |
          set -euo pipefail

          remote_dir="$(
            ssh \
              -F "$HOME/.ssh/gm_measurements_config" \
              gm-wordpress-measurements \
              'umask 077; mktemp -d /tmp/gm-measurements-upload.XXXXXXXX'
          )"

          [[ "$remote_dir" =~ ^/tmp/gm-measurements-upload\.[A-Za-z0-9]+$ ]]

          echo "REMOTE_UPLOAD_DIR=$remote_dir" >> "$GITHUB_ENV"

      - name: Upload checked archive
        shell: bash
        run: |
          set -euo pipefail

          scp \
            -F "$HOME/.ssh/gm_measurements_config" \
            dist/gm-model-measurements.tar.gz \
            dist/SHA256SUMS \
            "gm-wordpress-measurements:$REMOTE_UPLOAD_DIR/"

      - name: Back up and deploy plugin
        shell: bash
        run: |
          set -euo pipefail

          ssh \
            -F "$HOME/.ssh/gm_measurements_config" \
            gm-wordpress-measurements \
            "bash -s -- '$WP_ROOT' '$WP_CLI' '$REMOTE_UPLOAD_DIR' '$GITHUB_SHA'" \
            <<'REMOTE'
          set -Eeuo pipefail
          umask 022

          export PATH=/usr/local/bin:/usr/bin:/bin

          wp_root="$1"
          wp_cli="$2"
          upload_dir="$3"
          revision="$4"

          slug="gm-model-measurements"
          destination="$wp_root/wp-content/plugins/$slug"

          state_dir="$HOME/.local/state/gm-model-measurements"
          backups_dir="$state_dir/backups"

          stage="$upload_dir/new"
          restore_dir="$upload_dir/restore"

          backup=""
          changed=0
          completed=0

          fail() {
            printf 'ERROR: %s\n' "$*" >&2
            exit 1
          }

          wp_cmd() {
            timeout 60s \
              php "$wp_cli" \
              --path="$wp_root" \
              --skip-plugins \
              --skip-themes \
              "$@"
          }

          assert_inactive() {
            local active

            active="$(
              wp_cmd plugin list --status=active --field=name
            )"

            if printf '%s\n' "$active" | grep -Fxq "$slug"; then
              fail "Plugin is active. File replacement refused."
            fi
          }

          rollback_on_error() {
            local status=$?
            trap - EXIT

            if [[ "$status" -ne 0 &&
                  "$changed" -eq 1 &&
                  "$completed" -eq 0 &&
                  -n "$backup" &&
                  -f "$backup" ]]; then

              echo "Deployment failed. Attempting content rollback." >&2

              if mkdir -p "$restore_dir" &&
                  tar -xzf "$backup" -C "$restore_dir" &&
                  rsync \
                    -r \
                    --delete \
                    --perms \
                    --chmod=D2755,F644 \
                    --no-owner \
                    --no-group \
                    "$restore_dir/" "$destination/"; then
                echo "Previous plugin contents restored." >&2
              else
                echo "CRITICAL: Automatic rollback failed." >&2
                echo "Backup: $backup" >&2
              fi
            fi

            exit "$status"
          }

          trap rollback_on_error EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM

          [[ "$(id -un)" == "deploy" ]] ||
            fail "Expected SSH user deploy."

          [[ "$revision" =~ ^[0-9a-f]{40}$ ]] ||
            fail "Invalid revision."

          [[ "$upload_dir" =~ ^/tmp/gm-measurements-upload\.[A-Za-z0-9]+$ ]] ||
            fail "Invalid upload directory."

          for executable in \
            php \
            rsync \
            tar \
            sha256sum \
            flock \
            timeout \
            readlink \
            stat \
            find \
            grep \
            install
          do
            command -v "$executable" >/dev/null ||
              fail "Required executable not found: $executable"
          done

          test -f "$wp_root/wp-load.php" ||
            fail "WordPress entrypoint not found."

          test -f "$wp_cli" ||
            fail "WP-CLI not found at configured path."

          [[ -d "$destination" && ! -L "$destination" ]] ||
            fail "Create the plugin directory before deployment."

          [[ "$(readlink -f "$destination")" == "$destination" ]] ||
            fail "Destination path must not contain symlinks."

          [[ -w "$destination" && -x "$destination" ]] ||
            fail "deploy cannot write to the plugin directory."

          [[ "$(stat -c '%U:%G' "$destination")" == "deploy:www-data" ]] ||
            fail "Expected destination owner deploy:www-data."

          [[ "$(stat -c '%a' "$destination")" == "2755" ]] ||
            fail "Expected destination directory mode 2755."

          if [[ -n "$(find "$destination" -type l -print -quit)" ]]; then
            fail "Existing plugin contains symlinks."
          fi

          if [[ -n "$(
            find "$destination" \
              \( ! -type d -a ! -type f \) \
              -print -quit
          )" ]]; then
            fail "Existing plugin contains unsupported file types."
          fi

          if [[ -n "$(
            find "$destination" \
              \( ! -user deploy -o ! -group www-data \) \
              -print -quit
          )" ]]; then
            fail "Existing plugin entries must belong to deploy:www-data."
          fi

          install -d -m 700 "$state_dir" "$backups_dir"

          exec 9>"$state_dir/deploy.lock"
          flock -n 9 ||
            fail "Another measurements deployment is running."

          # A failing WordPress bootstrap must stop deployment.
          wp_cmd core is-installed >/dev/null

          # Only single-site installations are supported.
          wp_cmd eval '
            if (is_multisite()) {
                fwrite(STDERR, "Multisite is not supported by this workflow.\n");
                exit(1);
            }
          '

          assert_inactive

          (
            cd "$upload_dir"
            sha256sum --check SHA256SUMS
          )

          mkdir -m 700 "$stage"

          tar \
            --no-same-owner \
            --no-same-permissions \
            -xzf "$upload_dir/$slug.tar.gz" \
            -C "$stage"

          required=(
            gm-model-measurements.php
            includes/dictionaries.php
            includes/measurements.php
            includes/validation.php
            includes/admin.php
            includes/persistence.php
            includes/dictionary-guards.php
            includes/publication-guards.php
            assets/admin.js
            assets/admin.css
          )

          for file in "${required[@]}"; do
            test -f "$stage/$file" ||
              fail "Required uploaded file missing: $file"
          done

          if [[ -n "$(find "$stage" -type l -print -quit)" ]]; then
            fail "Uploaded plugin contains symlinks."
          fi

          if [[ -n "$(
            find "$stage" \
              \( ! -type d -a ! -type f \) \
              -print -quit
          )" ]]; then
            fail "Uploaded plugin contains unsupported file types."
          fi

          # Repeat syntax checks using the server's PHP CLI.
          php --version

          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(
            find "$stage" -type f -name '*.php' -print0
          )

          backup="$backups_dir/$slug-$(date -u +%Y%m%dT%H%M%SZ)-${revision:0:12}-$$.tar.gz"

          tar -C "$destination" -czf "$backup" .
          chmod 600 "$backup"

          # Check backup readability before modifying installed files.
          tar -tzf "$backup" >/dev/null

          # This narrows, but does not eliminate, the activation race.
          # No administrator or external process may activate the
          # plugin while this deployment is running.
          assert_inactive

          changed=1

          rsync \
            -r \
            --delete \
            --perms \
            --chmod=D2755,F644 \
            --no-owner \
            --no-group \
            "$stage/" "$destination/"

          differences="$(
            rsync \
              -rcn \
              --delete \
              --itemize-changes \
              "$stage/" "$destination/"
          )"

          [[ -z "$differences" ]] ||
            fail "Installed files do not match the deployment archive."

          if [[ -n "$(
            find "$destination" \
              \( ! -user deploy -o ! -group www-data \) \
              -print -quit
          )" ]]; then
            fail "Installed ownership verification failed."
          fi

          if [[ -n "$(
            find "$destination" \
              -type d ! -perm 2755 \
              -print -quit
          )" ]]; then
            fail "Installed directory permissions verification failed."
          fi

          if [[ -n "$(
            find "$destination" \
              -type f ! -perm 0644 \
              -print -quit
          )" ]]; then
            fail "Installed file permissions verification failed."
          fi

          test -r "$destination/$slug.php" ||
            fail "Installed plugin entrypoint is not readable."

          completed=1

          echo "Plugin files deployed."
          echo "Revision: $revision"
          echo "Owner: deploy:www-data"
          echo "Directory mode: 2755"
          echo "File mode: 644"
          echo "Backup: $backup"
          echo "No activation command was executed."
          REMOTE

      - name: Remove remote upload directory
        if: always() && env.REMOTE_UPLOAD_DIR != ''
        shell: bash
        run: |
          set -euo pipefail

          [[ "$REMOTE_UPLOAD_DIR" =~ ^/tmp/gm-measurements-upload\.[A-Za-z0-9]+$ ]]

          ssh \
            -F "$HOME/.ssh/gm_measurements_config" \
            gm-wordpress-measurements \
            "rm -rf -- '$REMOTE_UPLOAD_DIR'"

      - name: Remove SSH credentials
        if: always()
        shell: bash
        run: |
          rm -f \
            "$HOME/.ssh/gm_measurements_key" \
            "$HOME/.ssh/gm_measurements_known_hosts" \
            "$HOME/.ssh/gm_measurements_config"

      - name: Write deployment summary
        if: success()
        shell: bash
        run: |
          {
            echo "## Model Measurements — files deployed"
            echo
            echo "- Revision: \`$GITHUB_SHA\`"
            echo "- SSH user: deploy"
            echo "- SSH host keys: collected with ssh-keyscan"
            echo "- StrictHostKeyChecking: yes"
            echo "- sudo: not used"
            echo "- Owner: deploy:www-data"
            echo "- Directories: 2755"
            echo "- Files: 644"
            echo "- Previous contents backed up on the server"
            echo "- Activation command: not executed"
            echo "- No explicit database or WordPress configuration changes are requested by this workflow"
            echo "- Concurrent activation must be prevented operationally"
            echo "- Functional tests and acceptance: still required"
          } >> "$GITHUB_STEP_SUMMARY"
