name: WordPress — Deploy Model Measurements

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Режим запуска"
        required: true
        default: check
        type: choice
        options:
          - check
          - deploy-inactive

      confirmation:
        description: "Для deploy-inactive введите DEPLOY"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-model-measurements
  cancel-in-progress: false

env:
  PLUGIN_SLUG: gm-model-measurements
  PLUGIN_SOURCE: wordpress/plugins/gm-model-measurements

jobs:
  check:
    name: Check and package
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout selected revision
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Validate requested mode
        env:
          REQUESTED_MODE: ${{ inputs.mode }}
          CONFIRMATION: ${{ inputs.confirmation }}
          SELECTED_REF: ${{ github.ref }}
        shell: bash
        run: |
          set -euo pipefail

          case "$REQUESTED_MODE" in
            check)
              ;;
            deploy-inactive)
              [[ "$CONFIRMATION" == "DEPLOY" ]] || {
                echo "::error::Для развёртывания введите DEPLOY."
                exit 1
              }

              [[ "$SELECTED_REF" == "refs/heads/main" ]] || {
                echo "::error::Развёртывание разрешено только из main."
                exit 1
              }
              ;;
            *)
              echo "::error::Неизвестный режим."
              exit 1
              ;;
          esac

      - name: Validate plugin structure and create file manifest
        shell: bash
        run: |
          set -euo pipefail

          [[ -d "$PLUGIN_SOURCE" && ! -L "$PLUGIN_SOURCE" ]]

          if [[ -n "$(
            find "$PLUGIN_SOURCE" \
              \( ! -type d -a ! -type f \) \
              -print -quit
          )" ]]; then
            echo "::error::Ссылки и специальные файлы запрещены."
            exit 1
          fi

          mkdir -p dist

          cat > dist/plugin-files.txt <<'FILES'
          gm-model-measurements.php
          includes/dictionaries.php
          includes/measurements.php
          includes/validation.php
          includes/graphql.php
          includes/graphql-legacy-length.php
          includes/admin.php
          includes/persistence.php
          includes/dictionary-guards.php
          includes/publication-guards.php
          assets/admin.js
          assets/admin.css
          FILES

          while IFS= read -r file; do
            [[ -f "$PLUGIN_SOURCE/$file" ]] || {
              echo "::error::Отсутствует обязательный файл: $file"
              exit 1
            }
          done < dist/plugin-files.txt

          test -f "$PLUGIN_SOURCE/tests/graphql-unit.php"

      - name: Check PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          php --version

          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(
            find "$PLUGIN_SOURCE" -type f -name '*.php' -print0
          )

      - name: Verify legacy module inclusion
        shell: bash
        run: |
          set -euo pipefail

          php <<'PHP'
          <?php
          $entrypoint = getenv('PLUGIN_SOURCE')
              . '/gm-model-measurements.php';

          $source = file_get_contents($entrypoint);

          if ($source === false) {
              throw new RuntimeException('Cannot read plugin entrypoint.');
          }

          $tokens = token_get_all($source);
          $includes = [];

          foreach ($tokens as $index => $token) {
              if (
                  !is_array($token)
                  || !in_array(
                      $token[0],
                      [T_REQUIRE, T_REQUIRE_ONCE],
                      true
                  )
              ) {
                  continue;
              }

              for ($i = $index + 1; $i < count($tokens); $i++) {
                  $part = $tokens[$i];

                  if ($part === ';') {
                      break;
                  }

                  if (
                      is_array($part)
                      && $part[0] === T_CONSTANT_ENCAPSED_STRING
                  ) {
                      $includes[] = substr($part[1], 1, -1);
                  }
              }
          }

          $graphql = array_search(
              '/includes/graphql.php',
              $includes,
              true
          );

          $legacy = array_search(
              '/includes/graphql-legacy-length.php',
              $includes,
              true
          );

          if (
              $graphql === false
              || $legacy === false
              || $legacy <= $graphql
          ) {
              throw new RuntimeException(
                  'Require graphql-legacy-length.php after graphql.php.'
              );
          }

          echo "Legacy module inclusion: passed\n";
          PHP

      - name: Run existing GraphQL unit tests
        shell: bash
        run: |
          set -euo pipefail
          php "$PLUGIN_SOURCE/tests/graphql-unit.php"

      - name: Run legacy length standalone checks
        shell: bash
        run: |
          set -euo pipefail

          php <<'PHP'
          <?php
          define('ABSPATH', __DIR__ . '/');

          $registered = [];

          function add_filter(
              $hook,
              $callback,
              $priority = 10,
              $accepted_args = 1
          ) {
              global $registered;

              $registered[] = [
                  $hook,
                  $callback,
                  $priority,
                  $accepted_args,
              ];

              return true;
          }

          require getenv('PLUGIN_SOURCE')
              . '/includes/graphql-legacy-length.php';

          $extract = 'GlushkovModelling\\ModelMeasurements\\'
              . 'legacy_length_string_from_graphql_measurements';

          $configure = 'GlushkovModelling\\ModelMeasurements\\'
              . 'configure_legacy_model_length_graphql';

          $resolver = 'GlushkovModelling\\ModelMeasurements\\'
              . 'resolve_legacy_model_length_graphql';

          function expect_same($expected, $actual, $label)
          {
              if ($expected !== $actual) {
                  throw new RuntimeException(
                      $label . ': expected '
                      . var_export($expected, true)
                      . ', got '
                      . var_export($actual, true)
                  );
              }
          }

          $row = static function ($value, $target = null) {
              return [
                  'code' => 'overall_length',
                  'valueMm' => $value,
                  'target' => $target,
              ];
          };

          $cases = [
              ['integer', [$row(832)], '832'],
              ['fraction', [$row(879.5)], '879.5'],
              ['empty', [], null],
              ['duplicate', [$row(832), $row(833)], null],
              ['zero', [$row(0)], null],
              ['negative', [$row(-1)], null],
              ['infinity', [$row(INF)], null],
              ['nan', [$row(NAN)], null],
              ['string', [$row('832')], null],
              ['boolean', [$row(true)], null],
              [
                  'targeted length',
                  [$row(832, ['kind' => 'mast', 'id' => 'main_mast'])],
                  null,
              ],
              [
                  'different measurement',
                  [['code' => 'hull_width', 'valueMm' => 130]],
                  null,
              ],
          ];

          foreach ($cases as [$label, $input, $expected]) {
              expect_same($expected, $extract($input), $label);
          }

          $field = [
              'type' => 'String',
              'description' => 'Existing description',
              'resolve' => 'old_resolver',
          ];

          $instance = new class {
              public function get_graphql_field_group_type_name()
              {
                  return 'Modelinfo';
              }

              public function get_graphql_field_name()
              {
                  return 'modellength';
              }
          };

          $updated = $configure($field, $instance);

          expect_same('String', $updated['type'], 'preserve type');
          expect_same(
              $field['description'],
              $updated['description'],
              'preserve description'
          );
          expect_same(
              $resolver,
              $updated['resolve'],
              'replace resolver'
          );

          $other = new class {
              public function get_graphql_field_group_type_name()
              {
                  return 'Modelinfo';
              }

              public function get_graphql_field_name()
              {
                  return 'modelscale';
              }
          };

          expect_same(
              $field,
              $configure($field, $other),
              'leave other fields unchanged'
          );

          expect_same(
              null,
              $resolver(['modellength' => '999']),
              'do not return legacy root value'
          );

          expect_same(
              'wpgraphql/acf/get_graphql_field_config',
              $registered[0][0] ?? null,
              'register ACF configuration filter'
          );

          echo "Legacy length standalone checks: passed\n";
          echo "These checks do not bootstrap WordPress or ACF.\n";
          PHP

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check "$PLUGIN_SOURCE/assets/admin.js"

      - name: Package checked plugin
        shell: bash
        run: |
          set -euo pipefail

          tar \
            -C "$PLUGIN_SOURCE" \
            -czf "dist/$PLUGIN_SLUG.tar.gz" \
            -T "$GITHUB_WORKSPACE/dist/plugin-files.txt"

          (
            cd dist
            sha256sum "$PLUGIN_SLUG.tar.gz" > SHA256SUMS
          )

          tar -tzf "dist/$PLUGIN_SLUG.tar.gz"

      - name: Upload checked artifact
        uses: actions/upload-artifact@v4
        with:
          name: model-measurements-${{ github.sha }}
          path: |
            dist/gm-model-measurements.tar.gz
            dist/SHA256SUMS
            dist/plugin-files.txt
          if-no-files-found: error
          retention-days: 14

      - name: Write check summary
        shell: bash
        run: |
          {
            echo "## Model Measurements — checks"
            echo
            echo "- Revision: \`$GITHUB_SHA\`"
            echo "- PHP syntax on runner: passed"
            echo "- Existing GraphQL standalone unit tests: passed"
            echo "- Legacy length standalone checks: passed"
            echo "- Legacy module inclusion: checked"
            echo "- JavaScript syntax: passed"
            echo "- Archive includes graphql-legacy-length.php"
            echo "- WordPress/ACF integration tests: not performed"
            echo "- Installed WPGraphQL for ACF compatibility: not verified"
            echo "- Functional acceptance: still required"
            echo "- Server configuration: not checked in check mode"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy inactive plugin
    if: inputs.mode == 'deploy-inactive'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    environment: wordpress-production

    env:
      SSH_HOST: ${{ secrets.DEPLOY_HOST }}
      SSH_PORT: ${{ secrets.DEPLOY_PORT }}
      SSH_USER: ${{ secrets.DEPLOY_USER }}
      WP_ROOT: /var/www/cms/wordpress
      WP_CLI: ${{ vars.WP_CLI || '/usr/local/bin/wp' }}

    steps:
      - name: Download checked artifact
        uses: actions/download-artifact@v4
        with:
          name: model-measurements-${{ github.sha }}
          path: dist

      - name: Verify artifact checksum
        working-directory: dist
        shell: bash
        run: |
          set -euo pipefail
          sha256sum --check SHA256SUMS

      - name: Validate deployment settings
        shell: bash
        run: |
          set -euo pipefail

          [[ "$SSH_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.-]*$ ]]
          [[ "$SSH_USER" == "deploy" ]]
          [[ "$SSH_PORT" =~ ^[1-9][0-9]{0,4}$ ]]
          (( SSH_PORT <= 65535 ))

          for path in "$WP_ROOT" "$WP_CLI"; do
            [[ "$path" =~ ^/[A-Za-z0-9_./-]+$ ]]
            [[ "$path" != "/" ]]
            [[ "$path" != *"/../"* ]]
            [[ "$path" != */.. ]]
          done

      - name: Prepare SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077

          [[ -n "$SSH_PRIVATE_KEY" ]]
          install -d -m 700 "$HOME/.ssh"

          printf '%s\n' "$SSH_PRIVATE_KEY" \
            > "$HOME/.ssh/gm_measurements_key"

          chmod 600 "$HOME/.ssh/gm_measurements_key"

          ssh-keyscan \
            -T 10 \
            -p "$SSH_PORT" \
            -H "$SSH_HOST" \
            > "$HOME/.ssh/gm_measurements_known_hosts"

          test -s "$HOME/.ssh/gm_measurements_known_hosts"

          lookup_host="$SSH_HOST"
          if [[ "$SSH_PORT" != "22" ]]; then
            lookup_host="[$SSH_HOST]:$SSH_PORT"
          fi

          ssh-keygen \
            -F "$lookup_host" \
            -f "$HOME/.ssh/gm_measurements_known_hosts" \
            >/dev/null

          cat > "$HOME/.ssh/gm_measurements_config" <<EOF
          Host gm-wordpress-measurements
            HostName $SSH_HOST
            Port $SSH_PORT
            User $SSH_USER
            IdentityFile $HOME/.ssh/gm_measurements_key
            UserKnownHostsFile $HOME/.ssh/gm_measurements_known_hosts
            GlobalKnownHostsFile /dev/null
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            ConnectTimeout 15
            ServerAliveInterval 15
            ServerAliveCountMax 3
          EOF

          chmod 600 "$HOME/.ssh/gm_measurements_config"

      - name: Create private upload directory
        shell: bash
        run: |
          set -euo pipefail

          remote_dir="$(
            ssh \
              -F "$HOME/.ssh/gm_measurements_config" \
              gm-wordpress-measurements \
              'umask 077; mktemp -d /tmp/gm-measurements-upload.XXXXXXXX'
          )"

          [[ "$remote_dir" =~ ^/tmp/gm-measurements-upload\.[A-Za-z0-9]+$ ]]
          echo "REMOTE_UPLOAD_DIR=$remote_dir" >> "$GITHUB_ENV"

      - name: Upload checked artifact
        shell: bash
        run: |
          set -euo pipefail

          scp \
            -F "$HOME/.ssh/gm_measurements_config" \
            dist/gm-model-measurements.tar.gz \
            dist/SHA256SUMS \
            dist/plugin-files.txt \
            "gm-wordpress-measurements:$REMOTE_UPLOAD_DIR/"

      - name: Back up and deploy inactive plugin
        shell: bash
        run: |
          set -euo pipefail

          ssh \
            -F "$HOME/.ssh/gm_measurements_config" \
            gm-wordpress-measurements \
            "bash -s -- '$WP_ROOT' '$WP_CLI' '$REMOTE_UPLOAD_DIR' '$GITHUB_SHA'" \
            <<'REMOTE'
          set -Eeuo pipefail
          umask 022
          export PATH=/usr/local/bin:/usr/bin:/bin

          wp_root="$1"
          wp_cli="$2"
          upload_dir="$3"
          revision="$4"

          slug="gm-model-measurements"
          destination="$wp_root/wp-content/plugins/$slug"
          state_dir="$HOME/.local/state/$slug"
          backups_dir="$state_dir/backups"
          stage="$upload_dir/new"
          restore="$upload_dir/restore"

          backup=""
          changed=0
          completed=0

          fail() {
            printf 'ERROR: %s\n' "$*" >&2
            exit 1
          }

          wp_cmd() {
            timeout 60s php "$wp_cli" \
              --path="$wp_root" \
              --skip-plugins \
              --skip-themes \
              "$@"
          }

          assert_inactive() {
            local active
            active="$(wp_cmd plugin list --status=active --field=name)"

            if printf '%s\n' "$active" | grep -Fxq "$slug"; then
              fail "Plugin is active. File replacement refused."
            fi
          }

          rollback_on_error() {
            local status=$?
            trap - EXIT

            if [[ "$status" -ne 0 &&
                  "$changed" -eq 1 &&
                  "$completed" -eq 0 &&
                  -n "$backup" &&
                  -f "$backup" ]]; then
              echo "Deployment failed; attempting rollback." >&2

              if mkdir -p "$restore" &&
                  tar -xzf "$backup" -C "$restore" &&
                  rsync -r --delete --perms \
                    --chmod=D2755,F644 \
                    --no-owner --no-group \
                    "$restore/" "$destination/"; then
                echo "Previous contents restored." >&2
              else
                echo "CRITICAL: Automatic rollback failed." >&2
                echo "Backup: $backup" >&2
              fi
            fi

            exit "$status"
          }

          trap rollback_on_error EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM

          [[ "$(id -un)" == "deploy" ]] ||
            fail "Expected SSH user deploy."

          [[ "$revision" =~ ^[0-9a-f]{40}$ ]] ||
            fail "Invalid revision."

          [[ "$upload_dir" =~ ^/tmp/gm-measurements-upload\.[A-Za-z0-9]+$ ]] ||
            fail "Invalid upload directory."

          for executable in \
            php rsync tar sha256sum flock timeout \
            readlink stat find grep install
          do
            command -v "$executable" >/dev/null ||
              fail "Missing executable: $executable"
          done

          test -f "$wp_root/wp-load.php" ||
            fail "WordPress entrypoint not found."

          test -f "$wp_cli" ||
            fail "WP-CLI not found."

          [[ -d "$destination" && ! -L "$destination" ]] ||
            fail "Expected existing plugin directory."

          [[ "$(readlink -f "$destination")" == "$destination" ]] ||
            fail "Destination must not contain symlinks."

          [[ -w "$destination" && -x "$destination" ]] ||
            fail "Plugin directory is not writable."

          [[ "$(stat -c '%U:%G' "$destination")" == "deploy:www-data" ]] ||
            fail "Expected owner deploy:www-data."

          [[ "$(stat -c '%a' "$destination")" == "2755" ]] ||
            fail "Expected directory mode 2755."

          if [[ -n "$(
            find "$destination" \
              \( ! -type d -a ! -type f \) \
              -print -quit
          )" ]]; then
            fail "Existing plugin contains links or special files."
          fi

          if [[ -n "$(
            find "$destination" \
              \( ! -user deploy -o ! -group www-data \) \
              -print -quit
          )" ]]; then
            fail "Existing ownership is not deploy:www-data."
          fi

          install -d -m 700 "$state_dir" "$backups_dir"
          exec 9>"$state_dir/deploy.lock"
          flock -n 9 || fail "Another deployment is running."

          wp_cmd core is-installed >/dev/null

          wp_cmd eval '
            if (is_multisite()) {
                fwrite(STDERR, "Multisite is not supported.\n");
                exit(1);
            }
          '

          assert_inactive

          (
            cd "$upload_dir"
            sha256sum --check SHA256SUMS
          )

          mkdir -m 700 "$stage"

          tar \
            --no-same-owner \
            --no-same-permissions \
            -xzf "$upload_dir/$slug.tar.gz" \
            -C "$stage"

          if [[ -n "$(
            find "$stage" \
              \( ! -type d -a ! -type f \) \
              -print -quit
          )" ]]; then
            fail "Uploaded plugin contains links or special files."
          fi

          while IFS= read -r file; do
            case "$file" in
              ""|/*|../*|*/../*|*/..)
                fail "Invalid file manifest entry."
                ;;
            esac

            test -f "$stage/$file" ||
              fail "Uploaded file missing: $file"
          done < "$upload_dir/plugin-files.txt"

          test -f "$stage/includes/graphql-legacy-length.php" ||
            fail "Legacy GraphQL module is missing."

          php --version

          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(
            find "$stage" -type f -name '*.php' -print0
          )

          backup="$backups_dir/$slug-$(date -u +%Y%m%dT%H%M%SZ)-${revision:0:12}-$$.tar.gz"

          tar -C "$destination" -czf "$backup" .
          chmod 600 "$backup"
          tar -tzf "$backup" >/dev/null

          assert_inactive
          changed=1

          rsync -r --delete --perms \
            --chmod=D2755,F644 \
            --no-owner --no-group \
            "$stage/" "$destination/"

          differences="$(
            rsync -rcn --delete --itemize-changes \
              "$stage/" "$destination/"
          )"

          [[ -z "$differences" ]] ||
            fail "Installed files differ from checked artifact."

          if [[ -n "$(
            find "$destination" \
              \( ! -user deploy -o ! -group www-data \) \
              -print -quit
          )" ]]; then
            fail "Installed ownership verification failed."
          fi

          if [[ -n "$(
            find "$destination" -type d ! -perm 2755 -print -quit
          )" ]]; then
            fail "Installed directory mode verification failed."
          fi

          if [[ -n "$(
            find "$destination" -type f ! -perm 0644 -print -quit
          )" ]]; then
            fail "Installed file mode verification failed."
          fi

          assert_inactive
          completed=1

          echo "Plugin files deployed."
          echo "Revision: $revision"
          echo "Backup: $backup"
          echo "No activation command was executed."
          REMOTE

      - name: Remove remote upload directory
        if: always() && env.REMOTE_UPLOAD_DIR != ''
        shell: bash
        run: |
          set -euo pipefail

          [[ "$REMOTE_UPLOAD_DIR" =~ ^/tmp/gm-measurements-upload\.[A-Za-z0-9]+$ ]]

          ssh \
            -F "$HOME/.ssh/gm_measurements_config" \
            gm-wordpress-measurements \
            "rm -rf -- '$REMOTE_UPLOAD_DIR'"

      - name: Remove SSH credentials
        if: always()
        shell: bash
        run: |
          rm -f \
            "$HOME/.ssh/gm_measurements_key" \
            "$HOME/.ssh/gm_measurements_known_hosts" \
            "$HOME/.ssh/gm_measurements_config"

      - name: Write deployment summary
        if: success()
        shell: bash
        run: |
          {
            echo "## Model Measurements — files deployed"
            echo
            echo "- Revision: \`$GITHUB_SHA\`"
            echo "- Checked artifact installed"
            echo "- Legacy GraphQL module included"
            echo "- Previous contents backed up"
            echo "- Owner: deploy:www-data"
            echo "- Directories: 2755; files: 644"
            echo "- Activation/deactivation commands: not executed"
            echo "- Explicit database/configuration changes: not requested"
            echo "- SSH host keys: collected using ssh-keyscan"
            echo "- Concurrent activation must be prevented operationally"
            echo "- Installed ACF integration: still requires verification"
            echo "- Functional acceptance: still required"
          } >> "$GITHUB_STEP_SUMMARY"
